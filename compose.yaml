name: hatchet-local

services:
  postgres:
    image: postgres:15-alpine
    container_name: hatchet-postgres
    restart: always
    environment:
      POSTGRES_USER: hatchet
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: hatchet
    ports:
      - "5432:5432"
    volumes:
      - hatchet_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U hatchet -d hatchet" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  hatchet-lite:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:latest
    container_name: hatchet-lite-server
    restart: always
    ports:
      - "8888:8888" # Dashboard & API port
      - "7077:7077" # gRPC worker port
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://hatchet:mysecretpassword@postgres:5432/hatchet?sslmode=disable"
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_GRPC_PORT: "7077"
      SERVER_URL: http://localhost:8888
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:7077

volumes:
  hatchet_db_data: # Ensures task data stays saved across restarts
