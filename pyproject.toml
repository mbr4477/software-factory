[project]
name = "software-factory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Matthew Russell", email = "mbr4477@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "docker>=7.2.0",
    "fabric>=3.2.3",
    "hatchet-sdk>=1.40.3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
pipeline-worker = "software_factory.pipeline_worker:main"
trigger-pipeline = "software_factory.trigger:main"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]
